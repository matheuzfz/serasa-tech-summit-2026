name: Build and Deploy Presentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Permissões necessárias para publicar no GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Garante que apenas um deploy rode por vez
concurrency:
  group: pages
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  # ------------------------------------------------------------------
  # Job 1: Testes de qualidade (lint do Markdown)
  # ------------------------------------------------------------------
  test:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Lint do Markdown (markdownlint-cli)
        run: npx --yes markdownlint-cli presentation.md

  # ------------------------------------------------------------------
  # Job 2: Build do site estático com reveal-md e upload do artefato
  # ------------------------------------------------------------------
  build:
    name: Build Presentation
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: Gerar site estático com reveal-md
        run: npx --yes reveal-md presentation.md --static _site

      - name: Upload do artefato para o Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # ------------------------------------------------------------------
  # Job 3: Deploy no GitHub Pages
  # ------------------------------------------------------------------
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
