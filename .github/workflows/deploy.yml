name: Build and Deploy Landing Page

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Permissões necessárias para publicar no GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Garante que apenas um deploy rode por vez
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # Job 1: Testes de qualidade (lint do HTML)
  # ------------------------------------------------------------------
  test:
    name: Validate HTML
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Verificar que index.html existe
        run: test -f index.html

  # ------------------------------------------------------------------
  # Job 2: Build do site estático e upload do artefato
  # ------------------------------------------------------------------
  build:
    name: Build Static Site
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: Criar diretório de deploy
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets/ _site/assets/ 2>/dev/null || true

      - name: Upload do artefato para o Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # ------------------------------------------------------------------
  # Job 3: Deploy no GitHub Pages
  # ------------------------------------------------------------------
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
